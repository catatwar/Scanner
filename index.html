<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MTG Card Scanner</title>
<style>
  body{font-family:sans-serif;max-width:700px;margin:20px auto;padding:0 12px;}
  h2{margin-bottom:4px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center;}
  button{padding:8px 12px;font-size:14px;cursor:pointer;}
  #stage{position:relative;width:100%;max-width:400px;background:#eee;border:1px solid #ccc;}
  video, #captured{width:100%;display:block;}
  input[type=text], input[type=password]{width:100%;padding:8px;font-size:14px;box-sizing:border-box;}
  #suggestions{border:1px solid #ccc;max-height:160px;overflow-y:auto;}
  #suggestions div{padding:6px 8px;cursor:pointer;}
  #suggestions div:hover{background:#eee;}
  #result{margin-top:12px;display:flex;gap:12px;}
  #result img{width:120px;}
  #status{font-size:13px;color:#555;min-height:34px;white-space:pre-line;}
  fieldset{margin-top:16px;}
  label{font-size:13px;display:block;margin-bottom:4px;}

  #printsBackdrop{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
    align-items:center;justify-content:center;z-index:1000;padding:16px;
  }
  #printsModal{
    background:#fff;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;
    border-radius:8px;padding:16px;position:relative;
  }
  #printsClose{position:absolute;top:10px;right:10px;padding:4px 9px;}
  #printsModal h3{margin:0 24px 10px 0;font-size:16px;}
  .print-row{
    display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid #ddd;
    cursor:pointer;align-items:center;
  }
  .print-row:hover{background:#f2f2f2;}
  .print-row img{width:54px;border-radius:4px;flex-shrink:0;}
  .print-row .info{flex:1;font-size:12.5px;line-height:1.4;}
  .print-row .prices{font-size:12px;text-align:right;line-height:1.5;white-space:nowrap;}
  #printsNote{font-size:11.5px;color:#888;margin-top:8px;}
</style>
</head>
<body>

<h2>MTG Card Scanner</h2>
<p>Capture (or upload) a photo and it runs straight through: OCR.space reads the text, the likely card name is picked out automatically, and it's looked up on Scryfall — no manual crop or extra click.</p>

<fieldset>
<legend>Scan</legend>
<div id="stage">
  <div id="placeholder" style="padding:40px;text-align:center;color:#888;">Camera off</div>
  <video id="video" autoplay playsinline muted style="display:none;"></video>
  <img id="captured" style="display:none;" />
</div>
<div class="row">
  <button id="btnStartCam">Start camera</button>
  <button id="btnCapture" disabled>Capture &amp; identify</button>
  <button id="btnUpload">Upload photo</button>
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;" />
  <button id="btnRetake" style="display:none;">Retake</button>
</div>
<div id="status"></div>
</fieldset>

<fieldset>
<legend>Confirm / correct</legend>
<input type="text" id="searchInput" placeholder="Card name..." autocomplete="off" />
<div id="suggestions"></div>
<div id="result"></div>
</fieldset>


<div id="printsBackdrop">
  <div id="printsModal">
    <button id="printsClose">✕</button>
    <h3 id="printsTitle">Choose printing</h3>
    <div id="printsList"></div>
    <div id="printsNote"></div>
  </div>
</div>

<script>
(() => {
  // Paste your free OCR.space API key here (get one at https://ocr.space/ocrapi):
  const OCR_SPACE_API_KEY = 'k84051577888957';

  const $ = id => document.getElementById(id);
  const stage = $('stage'), placeholder = $('placeholder');
  const video = $('video'), captured = $('captured');
  const btnStartCam = $('btnStartCam'), btnCapture = $('btnCapture');
  const btnUpload = $('btnUpload'), fileInput = $('fileInput'), btnRetake = $('btnRetake');
  const searchInput = $('searchInput'), suggestions = $('suggestions');
  const statusEl = $('status'), resultEl = $('result');
  const printsBackdrop = $('printsBackdrop'), printsList = $('printsList');
  const printsTitle = $('printsTitle'), printsClose = $('printsClose'), printsNote = $('printsNote');

  let stream = null;
  let currentCard = null;

  function setStatus(msg, isErr){
    statusEl.textContent = msg;
    statusEl.style.color = isErr ? '#b00' : '#555';
  }

  // ---------- Camera ----------
  btnStartCam.addEventListener('click', async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, audio: false
      });
      video.srcObject = stream;
      video.style.display = 'block';
      placeholder.style.display = 'none';
      captured.style.display = 'none';
      btnCapture.disabled = false;
    } catch (e) {
      setStatus('Camera error: ' + e.message, true);
    }
  });

  btnCapture.addEventListener('click', () => {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w) return;
    const full = document.createElement('canvas');
    full.width = w; full.height = h;
    full.getContext('2d').drawImage(video, 0, 0, w, h);
    stopCamera();
    showCaptured(full.toDataURL('image/jpeg', 0.92));
    processImage(full);
  });

  btnUpload.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const full = document.createElement('canvas');
        full.width = img.naturalWidth;
        full.height = img.naturalHeight;
        full.getContext('2d').drawImage(img, 0, 0);
        stopCamera();
        showCaptured(full.toDataURL('image/jpeg', 0.92));
        processImage(full);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  });

  function stopCamera(){
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.style.display = 'none';
    btnCapture.disabled = true;
  }

  function showCaptured(dataUrl){
    captured.src = dataUrl;
    captured.style.display = 'block';
    placeholder.style.display = 'none';
    btnRetake.style.display = 'inline-block';
  }

  btnRetake.addEventListener('click', () => {
    captured.style.display = 'none';
    placeholder.style.display = 'block';
    btnRetake.style.display = 'none';
  });

  // Crop a region from a canvas, given ratios of its width/height (0-1).
  function cropRegion(canvas, xRatio, yRatio, wRatio, hRatio){
    const sx = canvas.width * xRatio, sy = canvas.height * yRatio;
    const sw = canvas.width * wRatio, sh = canvas.height * hRatio;
    const out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(sw));
    out.height = Math.max(1, Math.round(sh));
    out.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, out.width, out.height);
    return out;
  }

  // ---------- OCR.space ----------
  async function runOCR(dataUrl){
    if (!OCR_SPACE_API_KEY || OCR_SPACE_API_KEY === 'PASTE_YOUR_OCR_SPACE_API_KEY_HERE') {
      throw new Error('No OCR.space API key set — paste one into OCR_SPACE_API_KEY near the top of the script.');
    }
    const form = new FormData();
    form.append('apikey', OCR_SPACE_API_KEY);
    form.append('base64Image', dataUrl);
    form.append('language', 'eng');
    form.append('OCREngine', '2');
    form.append('isOverlayRequired', 'true');
    form.append('scale', 'true');
    form.append('detectOrientation', 'true');

    const res = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: form });
    const data = await res.json();
    if (data.IsErroredOnProcessing) {
      throw new Error((data.ErrorMessage && data.ErrorMessage.join(', ')) || 'OCR.space processing error.');
    }
    return data.ParsedResults && data.ParsedResults[0];
  }

  // Pick the most likely card-name line: topmost line with enough letters in it.
  function extractNameGuess(parsedResult){
    if (!parsedResult) return '';
    const lines = (parsedResult.TextOverlay && parsedResult.TextOverlay.Lines) || [];
    if (lines.length) {
      const sorted = [...lines].sort((a, b) => a.MinTop - b.MinTop);
      for (const line of sorted) {
        const cleaned = line.LineText.replace(/[^A-Za-z',.\- ]/g, '').trim();
        const letterCount = (cleaned.match(/[A-Za-z]/g) || []).length;
        if (letterCount >= 3) return cleaned;
      }
    }
    // fallback: first non-empty line of plain parsed text
    const plain = (parsedResult.ParsedText || '').split('\n').map(s => s.trim()).filter(Boolean);
    return plain[0] || '';
  }

  // ---------- Full pipeline: crop -> OCR -> guess -> Scryfall -> printings ----------
  async function processImage(sourceCanvas){
    resultEl.innerHTML = '';
    setStatus('Reading card text…');
    try {
      const titleCrop = cropRegion(sourceCanvas, 0, 0, 1, 0.16);
      const dataUrl = titleCrop.toDataURL('image/jpeg', 0.95);
      const parsed = await runOCR(dataUrl);
      const guess = extractNameGuess(parsed);
      if (!guess) {
        setStatus('Could not read any text — type the name manually below.', true);
        return;
      }
      searchInput.value = guess;
      setStatus('Read "' + guess + '" — searching Scryfall…');
      await identifyByName(guess);
    } catch (e) {
      setStatus('OCR failed: ' + e.message + ' — you can still type the name manually below.', true);
    }
  }

  // ---------- Scryfall throttled fetch ----------
  let lastCall = 0;
  async function scryfallFetch(url){
    const now = Date.now();
    const wait = Math.max(0, 75 - (now - lastCall));
    if (wait) await new Promise(r => setTimeout(r, wait));
    lastCall = Date.now();
    return fetch(url);
  }

  // Resolve a name to its canonical card, then show every printing of it so the
  // person can pick the one matching the photo (and see foil/non-foil price for each).
  async function identifyByName(name){
    if (!name) return;
    setStatus('Looking up "' + name + '"…');
    try {
      const res = await scryfallFetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(name)}`);
      if (!res.ok) {
        setStatus('No match found for "' + name + '" — edit the text above and try again.', true);
        return;
      }
      const card = await res.json();
      setStatus('Found "' + card.name + '" — loading printings…');
      await loadPrintings(card);
    } catch (e) {
      setStatus('Lookup failed: ' + e.message, true);
    }
  }

  async function loadPrintings(card){
    try {
      const res = await scryfallFetch(card.prints_search_uri + '&order=released&dir=desc');
      const data = await res.json();
      const prints = (data.data && data.data.length) ? data.data : [card];
      showPrintsModal(prints, card.name, data.has_more);
      setStatus('Pick the printing that matches your photo.');
    } catch (e) {
      // Fall back to just showing the single resolved card.
      renderCard(card);
      setStatus('Found "' + card.name + '" but could not load other printings.', true);
    }
  }

  function showPrintsModal(prints, name, hasMore){
    printsTitle.textContent = 'Choose printing — ' + name;
    printsList.innerHTML = '';
    prints.forEach(p => {
      const img = getImage(p);
      const nonfoil = p.prices && p.prices.usd ? '$' + p.prices.usd : '—';
      const foil = p.prices && p.prices.usd_foil ? '$' + p.prices.usd_foil : '—';
      const row = document.createElement('div');
      row.className = 'print-row';
      row.innerHTML = `
        ${img ? `<img src="${img}">` : ''}
        <div class="info">
          ${p.set_name}<br>
          <small>${(p.set || '').toUpperCase()} #${p.collector_number || '?'} · ${p.rarity || ''}</small>
        </div>
        <div class="prices">
          Non-foil: ${nonfoil}<br>
          Foil: ${foil}
        </div>
      `;
      row.addEventListener('click', () => {
        renderCard(p);
        printsBackdrop.style.display = 'none';
        setStatus('Selected the ' + p.set_name + ' printing.');
      });
      printsList.appendChild(row);
    });
    printsNote.textContent = hasMore ? 'Showing the most recent printings — older ones exist too.' : '';
    printsBackdrop.style.display = 'flex';
  }

  printsClose.addEventListener('click', () => { printsBackdrop.style.display = 'none'; });
  printsBackdrop.addEventListener('click', e => {
    if (e.target === printsBackdrop) printsBackdrop.style.display = 'none';
  });

  // ---------- Autocomplete (manual correction path) ----------
  let debounceTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = searchInput.value.trim();
    if (q.length < 2) { suggestions.innerHTML = ''; return; }
    debounceTimer = setTimeout(() => runAutocomplete(q), 250);
  });

  async function runAutocomplete(q){
    if (!q || q.length < 2) { suggestions.innerHTML = ''; return; }
    try {
      const res = await scryfallFetch(`https://api.scryfall.com/cards/autocomplete?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      const names = data.data || [];
      suggestions.innerHTML = '';
      names.slice(0, 10).forEach(name => {
        const div = document.createElement('div');
        div.textContent = name;
        div.addEventListener('click', () => {
          searchInput.value = name;
          suggestions.innerHTML = '';
          identifyByName(name);
        });
        suggestions.appendChild(div);
      });
    } catch (e) { /* best-effort */ }
  }

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      suggestions.innerHTML = '';
      identifyByName(searchInput.value.trim());
    }
  });

  // ---------- Render card result ----------
  function getImage(card){
    if (card.image_uris) return card.image_uris.normal;
    if (card.card_faces && card.card_faces[0].image_uris) return card.card_faces[0].image_uris.normal;
    return '';
  }
  function getManaCost(card){
    if (card.mana_cost) return card.mana_cost;
    if (card.card_faces) return card.card_faces.map(f => f.mana_cost).filter(Boolean).join(' // ');
    return '';
  }
  function getOracle(card){
    if (card.oracle_text) return card.oracle_text;
    if (card.card_faces) return card.card_faces.map(f => f.name + ' - ' + (f.oracle_text || '')).join('\n\n');
    return '';
  }

  function renderCard(card){
    currentCard = card;
    const img = getImage(card);
    const price = card.prices && card.prices.usd ? '$' + card.prices.usd : '-';
    const cnMatch = lastCollectorGuess
      ? (lastCollectorGuess === String(card.collector_number).replace(/^0+(?=\d)/, '')
          ? ' ✓ matches OCR read' : ' (OCR read #' + lastCollectorGuess + ' — double check)')
      : '';
    resultEl.innerHTML = `
      ${img ? `<img src="${img}" alt="${card.name}">` : ''}
      <div>
        <b>${card.name}</b><br>
        <small>${getManaCost(card)}</small><br>
        <small>${card.type_line || ''}</small>
        <p style="font-size:12px;max-height:100px;overflow-y:auto;">${(getOracle(card) || '').replace(/\n/g, '<br>')}</p>
        <small>${(card.set || '').toUpperCase()} #${card.collector_number || '?'}${cnMatch} · ${price}</small><br>
        <a href="${card.scryfall_uri}" target="_blank" rel="noopener">Scryfall page</a>
      </div>
    `;
  }
})();
</script>
</body>
</html>
